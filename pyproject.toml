[project]
name = "cc-wellness-spinner"
version = "0.2.0"
description = "Wellness-nudge spinner messages for Claude Code — while Claude works for you, it also looks out for you."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mgiovani" }]
requires-python = ">=3.10"
keywords = [
  "claude-code",
  "spinner",
  "spinner-verbs",
  "wellness",
  "ergonomics",
  "developer-health",
  "cli",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mgiovani/cc-wellness-spinner"

[project.scripts]
cc-wellness-spinner = "cc_wellness_spinner:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**"]
